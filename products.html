<!DOCTYPE html>
<html>
<head>
    <title>Products Page</title>
</head>
<body>

{% if current_user.is_authenticated %}
<div style="position:fixed;right:10px">
	<p>Welcome {{current_user.email}}.</p>
	<button type="button" id="logout" style="margin:5px;">Logout</button>
	<div id="auth_message" style="margin:5px;"></div>
	<div id="shopping_cart">
        <a href="/shopping_cart" style="margin:5px;">Shopping Cart</a>
        <div id="cart_message" style="margin:5px;"></div>
</div>
</div>
{% else %}
<div style="position:fixed;right:10px">
    <form id="user_input" style="display:flex">
           <label style="margin:5px;">Email:</label>
           <input type="email" id="email">
           <label style="margin:5px;">Password:</label>
           <input type="password" id="password">
    </form>
    <div id="auth_info">
        <button type="button" id="register" style="margin:5px;">Register</button>
        <button type="button" id="login" style="margin:5px;">Login</button>
        <div id="auth_message" style="margin:5px;"></div>
    </div>
    <div id="shopping_cart">
        <a href="/shopping_cart" style="margin:5px;" id="cart_link">Shopping Cart</a>
        <div id="cart_message" style="margin:5px;"></div>
    </div>
</div>
{% endif %}

<div style="position:fixed;left:10px">
	<a href="/admin" style="margin:5px;" id="admin_link">Admin</a>
</div>

<br><br>
<h1>Products</h1>

<div id="product_container"></div>

<script>
     document.addEventListener('DOMContentLoaded', function() {

	fetch('/api/products').then(response => response.json()).then(products => {
            
		let productContent = "";
              	
		products.forEach(product => {
               
			let stock_check = "";

			if (product.stock > 0 ) {
			
				stock_check = `<button type="button" class="add-to-cart-button" data-id="${product.id}" data-name="${product.name}">Add to cart</button>`;

			}

			else{
			
				stock_check = `<p>Item out of stock</p>`;

			}

			productContent += `<div id="product_entry">
                         
				<img src="${product.image_url}" width="100" height="100">
                         
				<h2>${product.name}</h2>
			       
                        	${stock_check}

				<p>ID: ${product.id} <br> ${product.description}</p>
                         
				<p>Price: $${product.price}; Stock: ${product.stock}</p>
                      
				</div>`;
              
		});
                  
		document.getElementById('product_container').innerHTML = productContent;
           
	})
           .catch(error => {

               console.error("Error loading products:", error);

               document.getElementById('product_container').innerHTML = "<p>Unable to load products.</p>";
           });
   
         document.getElementById('product_container').addEventListener('click', async function(e){
         
		 const productID = e.target.dataset.id;
         
		 const productName = e.target.dataset.name;

		 if (e.target.classList.contains('add-to-cart-button')){
	 
			 	try{
              
				 const response = await fetch('/carts',{
                 
						 method: 'POST',
                 
						 headers:{'Content-Type':'application/json'},
                 
						 body: JSON.stringify({product_id:productID,quantity: 1})
              
					});

		 			const data = await response.json();

		 			if (response.ok){
	
			 			document.getElementById('cart_message').innerHTML =`<p>${productName} added to cart.</p>`;
		 
		 			}

		 			else{
			 
			 			document.getElementById('cart_message').innerHTML =`<p>${data.error || 'Something went wrong'}</p>`;
		 			}
         		  	}
		 
			  	catch(error){
	
					console.error("Cart error:", error);
					document.getElementById('cart_message').innerHTML ='<p>No cart found. Log-in?</p>';
	
			  	}
			 }
		 
	 });
	
	     const register_element = document.getElementById('register');
	
	     if (register_element) {
           
		     register_element.addEventListener('click', async function(){
              
			     const user_info ={
             	 
				     email: document.getElementById('email').value,
             	 
				     password: document.getElementById('password').value
               
			     };
               
			     try{
                  
				     const response = await fetch('/register',{
                 	
					     method: 'POST',
                 	
					     headers:{'Content-Type':'application/json'},
                 	
					     body: JSON.stringify(user_info)
              	
				     });
	
	      	 
				     const data = await response.json();
	         
				     if (response.ok){
                    
					     document.getElementById("auth_message").innerHTML ='<p>User Registered.</p>';
	         
				     }
	         
				     else{
	            
					     document.getElementById("auth_message").innerHTML=`<p>${data.error || 'Registration Unsuccessful'}</p>`
	         
				     }
          	
			     }
	   	
			     catch (error){
              		
				     document.getElementById("auth_message").innerHTML ='<p>Internal Error</p>';
           	
			     }
	   
		     });
	
	     }
      
	     const login_element = document.getElementById('login'); 
      
	     if (login_element){
        
		     login_element.addEventListener('click', async function(){
          
			     const user_info ={
             
				     email: document.getElementById("email").value,
             
				     password: document.getElementById("password").value
          
			     };
       
			     try{        
        
				     const response = await fetch('/login',{
           
					     method: 'POST',
           
					     headers:{'Content-Type':'application/json'},
           
					     body: JSON.stringify(user_info)
        
				     });

				     const data = await response.json();

				     if (response.ok){ 
		
					     document.getElementById("auth_message").innerHTML ='<p>User Login Successful.</p>';
		
					     window.location.reload();
	
				     }
		
				     else{
		
					     document.getElementById("auth_message").innerHTML = `<p>${data.error || 'Sign-in Issue'}</p>`;
				     }
       	   
			     }
	   
			     catch (error) {
            	
				     document.getElementById("auth_message").innerHTML = '<p>Something went wrong...</p>';
			     }
	
		     });
      
	     }
	
	     document.getElementById("admin_link").addEventListener('click', async function(){
		
		const user_info ={
	
			email: document.getElementById("email").value,
			
			password: document.getElementById("password").value
            	};

	   	const response = await fetch('/admin',{
	     	
			method: 'GET',
	      	   
			headers: {'Content-Type':'application/json'},
	      	   
			body: JSON.stringify({user_info})
	   	});
		
		if (!response.ok){
			
			const data = await response.json();
			
			window.location.reload();
			
			document.getElementById("auth_message").innerHTML = `<p>${data.error || 'Unauthorized Access'}</p>`;
		}
	});

	document.getElementById("shopping_cart").addEventListener('click', async function(){
                
		const user_info ={
                
			email: document.getElementById("email").value,
                        
			password: document.getElementById("password").value
                };

                const response = await fetch('/shopping_cart',{
                 
			method: 'GET',
                   
			headers: {'Content-Type':'application/json'},
                   
			body: JSON.stringify({user_info})
                });
                
                if (response.ok){
			
			window.location.href = '/shopping_cart';
		}
		else {
                        
			document.getElementById("auth_message").innerHTML = '<p>Log-in Needed</p>';
		}
        });

	const logout_element = document.getElementById("logout");
	
	     if (logout_element){
	
		     logout_element.addEventListener('click', async function(){
           	
			     await fetch('/logout',{
              		
				     method: 'GET',
              		
				     headers: {'Content-Type':'application/json'},
           	
			     });
		
			     window.location.reload();
		
		     });
	
	     }

     });
</script>

</body>
</html>
